# Keeps the SHA-pinned actions, Python pins and the digest-pinned base image current.
# The cooldown skips releases younger than a week: hijacked releases (like the
# March 2026 Trivy incident) are usually caught and pulled within days.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
